# Terrain & Soil Intelligence — PostGIS + API (FastAPI) + frontend (nginx).
# Uso:  cp .env.example .env && docker compose up --build   →  http://localhost:8080
# NÃO TESTADO nesta máquina (sem Docker): a sintaxe é validada por `python scripts/check_infra.py`.
name: terrain-soil
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-tsi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsi} -d ${POSTGRES_DB:-tsi}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      TSI_MODE: ${TSI_MODE:-demo}
      TSI_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tsi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tsi}
      TSI_DATA_DIR: /data
      TSI_SAMPLE_DIR: /app/sample_data
      TSI_CORS_ORIGINS: http://localhost:8080
    volumes:
      - tsidata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  tsidata:
